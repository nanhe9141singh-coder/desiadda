<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - DesiAdda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fafafa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .signup-card { width: 100%; max-width: 380px; padding: 30px; background: white; border: 1px solid #dbdbdb; border-radius: 8px; text-align: center; }
        .logo-text { font-family: cursive; font-size: 32px; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="signup-card">
        <div class="logo-text" id="siteLogoTitle">DesiAdda</div>
        <p class="text-muted fw-bold">Sign up to see photos, reels & stories from your friends.</p>
        
        <form id="signupForm">
            <div class="mb-2"><input type="text" id="emailOrMobile" class="form-control" placeholder="Mobile number or email" required></div>
            <div class="mb-2"><input type="text" id="name" class="form-control" placeholder="Full Name" required></div>
            <div class="mb-2"><input type="text" id="username" class="form-control" placeholder="Username" required></div>
            <div class="mb-2"><input type="date" id="dob" class="form-control" required></div>
            <div class="mb-3"><input type="password" id="password" class="form-control" placeholder="Password" required></div>
            <button type="submit" class="btn btn-primary w-100 mb-3">Sign Up</button>
        </form>

        <!-- OTP Verification Section (Hidden initially) -->
        <div id="otpSection" style="display:none;" class="mt-3 p-3 border bg-light rounded">
            <p class="text-success small fw-bold">OTP Screen par aa gaya hai (Mock OTP): <span id="displayOtp" class="fs-4 text-danger"></span></p>
            <input type="text" id="enteredOtp" class="form-control mb-2 text-center" placeholder="Enter 6-digit OTP">
            <button class="btn btn-success w-100" onclick="verifyOtpCode()">Verify & Register</button>
        </div>

        <p class="mt-3">Have an account? <a href="login.html">Log in</a></p>
    </div>

    <script>
        let registeredEmailOrMobile = "";

        fetch('/branding').then(res => res.json()).then(data => {
            if(data.siteName) document.getElementById('siteLogoTitle').innerText = data.siteName;
        });

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            registeredEmailOrMobile = document.getElementById('emailOrMobile').value;
            const payload = {
                emailOrMobile: registeredEmailOrMobile,
                name: document.getElementById('name').value,
                username: document.getElementById('username').value,
                dob: document.getElementById('dob').value,
                password: document.getElementById('password').value
            };

            const res = await fetch('/send-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if(res.ok) {
                document.getElementById('signupForm').style.display = 'none';
                document.getElementById('otpSection').style.display = 'block';
                document.getElementById('displayOtp').innerText = data.mockOtp;
            } else {
                alert(data.message);
            }
        });

        async function verifyOtpCode() {
            const otp = document.getElementById('enteredOtp').value;
            const res = await fetch('/verify-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ emailOrMobile: registeredEmailOrMobile, otp })
            });
            const data = await res.json();
            if(res.ok && data.success) {
                alert('Account ban gaya! Ab login karein.');
                window.location.href = 'login.html';
            } else {
                alert(data.message);
            }
        }
    </script>
</body>
</html>
