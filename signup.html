<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - DesiAdda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fafafa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .signup-card { background: white; border: 1px solid #dbdbdb; padding: 40px; width: 350px; text-align: center; border-radius: 4px; }
        .logo { font-family: 'Brush Script MT', cursive; font-size: 40px; color: #262626; margin-bottom: 20px; font-weight: bold; }
        .form-control { background-color: #fafafa; border: 1px solid #dbdbdb; font-size: 14px; margin-bottom: 10px; border-radius: 3px; }
        .btn-primary { width: 100%; background-color: #0095f6; border: none; font-weight: 600; padding: 7px; border-radius: 8px; margin-top: 10px; }
        .btn-primary:hover { background-color: #1877f2; }
        .switch-box { background: white; border: 1px solid #dbdbdb; padding: 20px; width: 350px; text-align: center; margin-top: 10px; border-radius: 4px; font-size: 14px; }
        .switch-box a { color: #0095f6; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <div style="display: flex; flex-direction: column; align-items: center;">
        <div class="signup-card">
            <div class="logo">DesiAdda</div>
            <p style="color: #8e8e8e; font-weight: 600; font-size: 15px; margin-bottom: 20px;">Doston ki duniya me judne ke liye sign up karein.</p>
            
            <form id="signupForm">
                <input type="text" id="emailOrMobile" class="form-control" placeholder="Mobile number or email" required>
                <input type="text" id="name" class="form-control" placeholder="Full Name" required>
                <input type="text" id="username" class="form-control" placeholder="Username" required>
                <input type="password" id="password" class="form-control" placeholder="Password" required>
                
                <div class="text-start" style="font-size: 12px; color: #8e8e8e; margin: 10px 0;">
                    <label>Birth Date:</label>
                    <input type="date" id="dob" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary">Sign up</button>
            </form>

            <div id="errorMsg" class="text-danger mt-2" style="font-size: 13px;"></div>
        </div>

        <div class="switch-box">
            Account hai? <a href="login.html">Log in</a>
        </div>
    </div>

    <!-- OTP Modal -->
    <div class="modal fade" id="otpModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-4 text-center">
                <h4>OTP Verification</h4>
                <p class="text-muted">Aapke email/mobile par bheja gaya 6 digit OTP darj karein</p>
                <input type="text" id="otpInput" class="form-control text-center fs-4" placeholder="------" maxlength="6">
                <button id="verifyOtpBtn" class="btn btn-success mt-3">Verify & Register</button>
                <div id="mockOtpDisplay" class="mt-2 text-primary font-monospace" style="font-size: 14px;"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let registeredData = {};

        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            registeredData = {
                emailOrMobile: document.getElementById('emailOrMobile').value,
                name: document.getElementById('name').value,
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                dob: document.getElementById('dob').value
            };
            const errorMsg = document.getElementById('errorMsg');

            try {
                const response = await fetch('/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(registeredData)
                });
                const data = await response.json();
                
                if (response.ok) {
                    var otpModal = new bootstrap.Modal(document.getElementById('otpModal'));
                    otpModal.show();
                    if(data.mockOtp) {
                        document.getElementById('mockOtpDisplay').innerText = "Testing OTP: " + data.mockOtp;
                    }
                } else {
                    errorMsg.innerText = data.message || "Kuch galat ho gaya!";
                }
            } catch (err) {
                errorMsg.innerText = "Server se connect nahi ho pa raha hai!";
            }
        });

        document.getElementById('verifyOtpBtn').addEventListener('click', async function() {
            const otp = document.getElementById('otpInput').value;
            try {
                const response = await fetch('/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ emailOrMobile: registeredData.emailOrMobile, otp: otp })
                });
                const data = await response.json();
                if(response.ok) {
                    alert("Account successfully ban gaya! Ab aap login kar sakte hain.");
                    window.location.href = 'login.html';
                } else {
                    alert(data.message || "Galat OTP!");
                }
            } catch (err) {
                alert("Server error!");
            }
        });
    </script>
</body>
</html>
