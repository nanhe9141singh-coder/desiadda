<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - DesiAdda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 400px;">
        <div class="card p-4 shadow-sm">
            <h3 class="text-center mb-4">🛡️ Admin Login</h3>
            <form id="adminLoginForm">
                <input type="text" id="adminUser" class="form-control mb-3" placeholder="Admin Username" required>
                <input type="password" id="adminPass" class="form-control mb-3" placeholder="Password" required>
                <button type="submit" class="btn btn-dark w-100">Login to Dashboard</button>
            </form>
            <div id="errorMsg" class="text-danger mt-2 text-center" style="font-size: 13px;"></div>
        </div>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('adminUser').value;
            const password = document.getElementById('adminPass').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                const res = await fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if(data.success) {
                    localStorage.setItem('desiadda_admin', data.username);
                    alert("Admin login safal raha!");
                    window.location.href = 'index.html'; // Ya apna admin dashboard page
                } else {
                    errorMsg.innerText = data.message;
                }
            } catch (err) { errorMsg.innerText = "Server error!"; }
        });
    </script>
</body>
</html>
