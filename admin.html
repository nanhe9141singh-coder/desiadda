<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - DesiAdda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: sans-serif; padding-top: 50px; }
        .admin-card { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <div id="loginBox" class="admin-card">
            <h3 class="mb-4 text-center">🔐 Admin Login</h3>
            <form id="adminLoginForm">
                <div class="mb-3"><input type="text" id="adminUser" class="form-control" placeholder="Admin Username" required></div>
                <div class="mb-3"><input type="password" id="adminPass" class="form-control" placeholder="Password" required></div>
                <button type="submit" class="btn btn-dark w-100">Login as Admin</button>
            </form>
        </div>

        <div id="dashboardBox" class="admin-card" style="display:none;">
            <h3 class="mb-4">⚙️ Website Branding & Control</h3>
            <div class="mb-3">
                <label class="fw-bold">Website Name</label>
                <input type="text" id="newSiteName" class="form-control">
            </div>
            <div class="mb-3">
                <label class="fw-bold">Logo Image URL</label>
                <input type="text" id="newLogoUrl" class="form-control" placeholder="https://example.com/logo.png">
            </div>
            <button class="btn btn-success w-100" onclick="updateBranding()">Update Website Branding</button>
            <button class="btn btn-outline-danger w-100 mt-2" onclick="location.reload()">Logout</button>
        </div>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('adminUser').value,
                    password: document.getElementById('adminPass').value
                })
            });
            const data = await res.json();
            if(res.ok && data.success) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('dashboardBox').style.display = 'block';
                loadCurrentBranding();
            } else {
                alert(data.message);
            }
        });

        async function loadCurrentBranding() {
            const res = await fetch('/branding');
            const data = await res.json();
            document.getElementById('newSiteName').value = data.siteName || "DesiAdda";
            document.getElementById('newLogoUrl').value = data.logoUrl || "";
        }

        async function updateBranding() {
            const siteName = document.getElementById('newSiteName').value;
            const logoUrl = document.getElementById('newLogoUrl').value;
            const res = await fetch('/branding', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ siteName, logoUrl })
            });
            const data = await res.json();
            if(res.ok) alert('Website branding successfully update ho gayi!');
            else alert('Error updating branding');
        }
    </script>
</body>
</html>
