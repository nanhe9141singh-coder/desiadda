<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DesiAdda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fafafa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; border: 1px solid #dbdbdb; padding: 40px; width: 350px; text-align: center; border-radius: 4px; }
        .logo { font-family: 'Brush Script MT', cursive; font-size: 40px; color: #262626; margin-bottom: 30px; font-weight: bold; }
        .form-control { background-color: #fafafa; border: 1px solid #dbdbdb; font-size: 14px; margin-bottom: 10px; border-radius: 3px; }
        .btn-primary { width: 100%; background-color: #0095f6; border: none; font-weight: 600; padding: 7px; border-radius: 8px; margin-top: 10px; }
        .btn-primary:hover { background-color: #1877f2; }
        .switch-box { background: white; border: 1px solid #dbdbdb; padding: 20px; width: 350px; text-align: center; margin-top: 10px; border-radius: 4px; font-size: 14px; }
        .switch-box a { color: #0095f6; text-decoration: none; font-weight: 600; }
        .admin-link { margin-top: 15px; font-size: 13px; }
        .admin-link a { color: #888; text-decoration: none; }
    </style>
</head>
<body>

    <div style="display: flex; flex-direction: column; align-items: center;">
        <div class="login-card">
            <div class="logo">DesiAdda</div>
            
            <form id="loginForm">
                <input type="text" id="username" class="form-control" placeholder="Username or email" required>
                <input type="password" id="password" class="form-control" placeholder="Password" required>
                <button type="submit" class="btn btn-primary">Log In</button>
            </form>

            <div id="errorMsg" class="text-danger mt-2" style="font-size: 13px;"></div>

            <div class="mt-3">
                <a href="#" style="font-size: 12px; color: #00376b; text-decoration: none;">Password bhool gaye?</a>
            </div>

            <hr style="margin: 20px 0; color: #dbdbdb;">

            <div class="admin-link">
                <a href="admin.html">🛡️ Admin Portal Login</a>
            </div>
        </div>

        <div class="switch-box">
            Account nahi hai? <a href="signup.html">Sign up</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                
                if (response.ok && data.success) {
                    localStorage.setItem('desiadda_user', data.username);
                    window.location.href = 'index.html';
                } else {
                    errorMsg.innerText = data.message || "Login fail ho gaya!";
                }
            } catch (err) {
                errorMsg.innerText = "Server se connect nahi ho pa raha hai!";
            }
        });
    </script>
</body>
</html>
