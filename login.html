<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DesiAdda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fafafa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .login-card { width: 100%; max-width: 350px; padding: 30px; background: white; border: 1px solid #dbdbdb; border-radius: 8px; text-align: center; }
        .logo-text { font-family: cursive; font-size: 36px; font-weight: bold; margin-bottom: 25px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-text" id="siteLogoTitle">DesiAdda</div>
        <form id="loginForm">
            <div class="mb-3"><input type="text" id="username" class="form-control" placeholder="Phone number, username, or email" required></div>
            <div class="mb-3"><input type="password" id="password" class="form-control" placeholder="Password" required></div>
            <button type="submit" class="btn btn-primary w-100 mb-3">Log In</button>
        </form>
        <p class="mt-3">Don't have an account? <a href="signup.html">Sign up</a></p>
        
        <!-- Secret Admin Login Link at the Very Bottom -->
        <div class="mt-5 pt-3 border-top">
            <a href="admin.html" class="text-muted text-decoration-none small">🔒 Admin Control Center</a>
        </div>
    </div>

    <script>
        // Load Dynamic Branding Name
        fetch('/branding').then(res => res.json()).then(data => {
            if(data.siteName) document.getElementById('siteLogoTitle').innerText = data.siteName;
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            });
            const data = await res.json();
            if(res.ok && data.success) {
                localStorage.setItem('desiadda_user', data.username);
                window.location.href = 'index.html';
            } else {
                alert(data.message || 'Login failed!');
            }
        });
    </script>
</body>
</html>
