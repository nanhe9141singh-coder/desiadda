<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesiAdda - Doston ki Duniya</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #fafafa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .sidebar { position: fixed; top: 0; left: 0; width: 245px; height: 100vh; background: white; border-right: 1px solid #dbdbdb; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; z-index: 100; }
        .sidebar-brand { font-family: 'Brush Script MT', cursive; font-size: 32px; font-weight: bold; color: #262626; margin-bottom: 30px; text-decoration: none; }
        .nav-link { font-size: 16px; color: #262626; padding: 12px 15px; border-radius: 8px; margin-bottom: 5px; display: flex; align-items: center; text-decoration: none; font-weight: 500; }
        .nav-link:hover, .nav-link.active { background-color: #f0f0f0; font-weight: bold; }
        .nav-link i { margin-right: 15px; font-size: 20px; }
        .main-content { margin-left: 245px; padding: 30px; display: flex; justify-content: center; }
        .feed-container { width: 100%; max-width: 600px; }
        .post-card { background: white; border: 1px solid #dbdbdb; border-radius: 8px; margin-bottom: 20px; }
        .post-header { display: flex; align-items: center; padding: 12px 15px; }
        .post-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; margin-right: 10px; }
        .post-img { width: 100%; max-height: 550px; object-fit: cover; }
        .post-actions { padding: 10px 15px; font-size: 24px; }
        .post-actions i { cursor: pointer; margin-right: 15px; }
        .post-body { padding: 0 15px 15px 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <a href="index.html" class="sidebar-brand">DesiAdda</a>
            <div class="nav flex-column">
                <a href="index.html" class="nav-link active"><i class="fa-solid fa-house"></i> Home</a>
                <a href="#" class="nav-link" onclick="alert('Explore section jald aayega!')"><i class="fa-solid fa-compass"></i> Explore</a>
                <a href="#" class="nav-link" onclick="alert('Messages section active hai!')"><i class="fa-solid fa-message"></i> Messages</a>
                <a href="#" class="nav-link" onclick="openCreatePostModal()"><i class="fa-solid fa-square-plus"></i> Create</a>
                <a href="#" class="nav-link" id="profileNavBtn"><i class="fa-solid fa-user"></i> Profile</a>
            </div>
        </div>
        <div>
            <a href="#" class="nav-link text-danger" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Log out</a>
        </div>
    </div>

    <div class="main-content">
        <div class="feed-container" id="postsFeed">
            <h4 class="text-center text-muted my-5">Posts load ho rahi hain...</h4>
        </div>
    </div>

    <!-- Create Post Modal -->
    <div class="modal fade" id="createPostModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-3">
                <h5 class="mb-3">Nayi Post Banayein</h5>
                <textarea id="postContent" class="form-control mb-2" rows="3" placeholder="Aaj kya chal raha hai dosto?"></textarea>
                <input type="text" id="postImage" class="form-control mb-3" placeholder="Image URL (optional)">
                <button class="btn btn-primary w-100" onclick="submitPost()">Post Share Karein</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const currentUser = localStorage.getItem('desiadda_user');
        if (!currentUser) { window.location.href = 'login.html'; }

        document.getElementById('profileNavBtn').href = `profile.html?user=${currentUser}`;

        function logout() {
            localStorage.removeItem('desiadda_user');
            window.location.href = 'login.html';
        }

        function openCreatePostModal() {
            var myModal = new bootstrap.Modal(document.getElementById('createPostModal'));
            myModal.show();
        }

        async function loadPosts() {
            try {
                const res = await fetch('/posts');
                const posts = await res.json();
                const feed = document.getElementById('postsFeed');
                if(posts.length === 0) {
                    feed.innerHTML = '<p class="text-center text-muted">Abhi koi post nahi hai.</p>';
                    return;
                }
                feed.innerHTML = posts.map(p => `
                    <div class="post-card">
                        <div class="post-header">
                            <img src="https://i.pravatar.cc/150?u=${p.username}" class="post-avatar">
                            <strong>${p.username}</strong>
                        </div>
                        ${p.image ? `<img src="${p.image}" class="post-img">` : ''}
                        <div class="post-actions">
                            <i class="fa-regular fa-heart" onclick="likePost('${p._id}')"></i>
                            <i class="fa-regular fa-comment"></i>
                        </div>
                        <div class="post-body">
                            <span class="fw-bold">${p.username}</span> ${p.content || ''}
                        </div>
                    </div>
                `).join('');
            } catch (err) { console.log(err); }
        }

        async function submitPost() {
            const content = document.getElementById('postContent').value;
            const image = document.getElementById('postImage').value;
            await fetch('/posts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser, content, image })
            });
            window.location.reload();
        }

        async function likePost(id) {
            await fetch(`/posts/${id}/like`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser })
            });
            loadPosts();
        }

        loadPosts();
    </script>
</body>
</html>
