<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">DesiAdda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #fafafa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .navbar { background: white; border-bottom: 1px solid #dbdbdb; }
        .main-container { max-width: 935px; margin: 20px auto; padding: 0 15px; }
        .card { border: 1px solid #dbdbdb; border-radius: 8px; margin-bottom: 20px; background: white; }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg sticky-top px-3">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold fs-4" href="index.html" id="brandLogoText">DesiAdda</a>
            <div class="d-flex align-items-center gap-3">
                <a href="index.html" class="text-dark fs-5"><i class="fa-solid fa-house"></i></a>
                <a href="profile.html" class="text-dark fs-5"><i class="fa-solid fa-user"></i></a>
                <button class="btn btn-outline-danger btn-sm" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container main-container">
        <!-- Welcome Banner -->
        <div class="card p-3 text-center bg-white shadow-sm">
            <h4 class="fw-bold">Swagat hai, <span id="welcomeUser" class="text-primary"></span>! 🔥</h4>
            <p class="text-muted mb-0">Apna din shuru karein DesiAdda par—Stories, Books, Confessions aur Polls ke sath!</p>
        </div>

        <!-- 1. Community Story Books Section -->
        <div class="card p-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold mb-0">📖 Community Story Books</h5>
                <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#bookModal">✍️ Write Book</button>
            </div>
            <div id="booksContainer" class="row">
                <p class="text-muted text-center">Books load ho rahi hain...</p>
            </div>
        </div>

        <!-- 2. Voice Notes & Confessions Wall -->
        <div class="card p-3">
            <h5 class="fw-bold mb-3">🤫 Whisper Wall & Confessions</h5>
            <div class="mb-3">
                <textarea id="confessionText" class="form-control mb-2" placeholder="Apna secret confession ya dil ki baat likhein..."></textarea>
                <button class="btn btn-dark btn-sm" onclick="postConfession()">Post Whisper</button>
            </div>
            <div id="confessionsContainer">
                <p class="text-muted text-center">Confessions load ho rahe hain...</p>
            </div>
        </div>

        <!-- 3. Desi Polls & Battles -->
        <div class="card p-3">
            <h5 class="fw-bold mb-3">📊 Desi Polls & Battles</h5>
            <div id="pollsContainer">
                <p class="text-muted text-center">Polls load ho rahe hain...</p>
            </div>
        </div>
    </div>

    <!-- Write Book Modal -->
    <div class="modal fade" id="bookModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content p-3">
                <h4 class="mb-3">New Story Book</h4>
                <input type="text" id="bookTitle" class="form-control mb-2" placeholder="Book Title">
                <select id="bookCategory" class="form-control mb-2">
                    <option value="Romance">Romance</option>
                    <option value="Thriller">Thriller</option>
                    <option value="Comedy">Comedy</option>
                    <option value="Desi Drama">Desi Drama</option>
                </select>
                <textarea id="bookContent" class="form-control mb-2" rows="5" placeholder="Apni kahani yahan likhein..."></textarea>
                <button class="btn btn-success w-100" onclick="publishBook()">Publish Book</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const loggedUser = localStorage.getItem('desiadda_user');
        if(!loggedUser) window.location.href = 'login.html';
        document.getElementById('welcomeUser').innerText = loggedUser;

        function logout() {
            localStorage.removeItem('desiadda_user');
            window.location.href = 'login.html';
        }

        // Load Branding Name & Logo
        fetch('/branding').then(res => res.json()).then(data => {
            if(data.siteName) {
                document.getElementById('brandLogoText').innerText = data.siteName;
                document.getElementById('pageTitle').innerText = data.siteName;
            }
        });

        // Load Story Books
        async function loadBooks() {
            const res = await fetch('/books');
            const books = await res.json();
            const container = document.getElementById('booksContainer');
            if(books.length === 0) { container.innerHTML = '<p class="text-muted text-center">Abhi koi book nahi hai.</p>'; return; }
            container.innerHTML = books.map(b => `
                <div class="col-md-4 mb-3">
                    <div class="p-3 border rounded bg-light h-100">
                        <span class="badge bg-primary mb-1">${b.category}</span>
                        <h6 class="fw-bold">${b.title}</h6>
                        <small class="text-muted">By @${b.author}</small>
                        <p class="small text-truncate mt-2">${b.content}</p>
                    </div>
                </div>
            `).join('');
        }

        async function publishBook() {
            const title = document.getElementById('bookTitle').value;
            const category = document.getElementById('bookCategory').value;
            const content = document.getElementById('bookContent').value;
            if(!title || !content) return alert('Sabhi fields bharein!');

            await fetch('/books', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, author: loggedUser, category, content })
            });
            location.reload();
        }

        // Load Confessions
        async function loadConfessions() {
            const res = await fetch('/confessions');
            const confs = await res.json();
            const container = document.getElementById('confessionsContainer');
            if(confs.length === 0) { container.innerHTML = '<p class="text-muted text-center">Abhi koi confession nahi hai.</p>'; return; }
            container.innerHTML = confs.map(c => `
                <div class="p-2 border-bottom mb-2">
                    <p class="mb-1">${c.text}</p>
                    <small class="text-muted">— ${c.isAnonymous ? 'Anonymous' : '@' + c.author}</small>
                </div>
            `).join('');
        }

        async function postConfession() {
            const text = document.getElementById('confessionText').value;
            if(!text) return alert kuch likhein!`;
            await fetch('/confessions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text, author: loggedUser })
            });
            document.getElementById('confessionText').value = '';
            loadConfessions();
        }

        // Load Polls
        async function loadPolls() {
            const res = await fetch('/polls');
            const polls = await res.json();
            const container = document.getElementById('pollsContainer');
            if(polls.length === 0) {
                container.innerHTML = `<div class="p-3 border rounded bg-light text-center">
                    <p class="fw-bold mb-1">Tea vs Coffee: Aapko kya pasand hai?</p>
                    <button class="btn btn-sm btn-outline-primary m-1">☕ Chai Lover</button>
                    <button class="btn btn-sm btn-outline-success m-1">🥤 Coffee Lover</button>
                </div>`;
                return;
            }
        }

        loadBooks();
        loadConfessions();
        loadPolls();
    </script>
</body>
</html>
